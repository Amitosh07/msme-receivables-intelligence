# Alembic Configuration for MSME Receivables Intelligence Platform

[alembic]
# Path to migration scripts
script_location = backend/migrations

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with project root
prepend_sys_path = .

# Timezone for generated migration scripts
timezone = UTC

# Max length of characters for slug
truncate_slug_length = 40

# Version locations
version_locations = backend/migrations/versions

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Database URL is dynamically loaded from backend.app.core.config.settings in env.py
# Placeholder below is overridden at runtime by env.py
sqlalchemy.url = postgresql+psycopg://postgres:placeholder@localhost:5432/msme_receivables

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
